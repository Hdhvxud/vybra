<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <!--
    While setting the CSP in HTTP headers is preferred, there does not seem to
    be a good way to do this in the react dev environment, so it is set here as
    a meta tag. Note that frame-ancestors CANNOT be set in the meta tag and
    MUST be set as a HTTP header in production!
    -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://*.spotifycdn.com https://*.scdn.co; connect-src 'self' https://vybra.onrender.com;" />

  <link rel="icon" href="<%= assetPrefix %>/favicon.ico" />
  <link rel="apple-touch-icon" href="<%= assetPrefix %>/logo192.png" />
  <link rel="manifest" href="<%= assetPrefix %>/manifest.json" crossorigin="use-credentials" />
  <script src="<%= assetPrefix %>/variables.js"></script>

  <title>VYBRA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />

  <meta name="title" content="VYBRA">
  <meta name="description" content="Your personal Spotify listening dashboard.">

  <meta property="og:type" content="image/png">
  <meta property="og:title" content="VYBRA">
  <meta property="og:description" content="Your personal Spotify listening dashboard.">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="VYBRA">
  <meta name="twitter:description" content="Your personal Spotify listening dashboard.">
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
